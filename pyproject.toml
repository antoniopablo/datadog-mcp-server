[project]
name = "datadog-mcp-server"
version = "0.1.0"
description = "MCP server that lets Claude inspect Datadog usage and answer cost questions, by an ex-Datadog SRE."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Antonio García" }]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
]

[project.scripts]
datadog-mcp = "datadog_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datadog_mcp"]
